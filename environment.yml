name: p2-continuous-control

# The old tensorflow-1.7 / python-3.6 stack is not needed, unityagents only wants
# grpc, protobuf, numpy and PIL. Two pins matter:
#   protobuf==3.20.3  -- the *_pb2.py files are too old for protobuf 4
#   numpy<2           -- unityagents/environment.py uses np.float_

channels:
  - conda-forge

dependencies:
  - python=3.10
  - pip
  - pip:
      # direct dependencies of reacher_ppo_nocritic.py / watch_reacher.py
      - matplotlib
      - numpy<2
      - torch
      # indirect: runtime dependencies of the vendored unityagents package
      - grpcio
      - pillow
      - protobuf==3.20.3
