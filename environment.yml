name: p2-continuous-control

# The Unity "Reacher" binary (ml-agents 0.4 / API-4, built 2018) still runs fine on
# modern Linux. Only the *Python* side needed unpinning from the original
# tensorflow-1.7 / python-3.6 stack. The `unityagents` package itself is vendored in
# the course repo under ../python and pulls in nothing but grpc + protobuf + numpy +
# PIL, so no TF required.
#
# Two pins matter:
#   protobuf==3.20.3  -- communicator_objects/*_pb2.py were generated by protoc 3.5.2;
#                        protobuf >=4.21 rejects that old descriptor style.
#   numpy<2           -- unityagents/environment.py uses np.float_, removed in NumPy 2.

channels:
  - conda-forge

dependencies:
  - python=3.10
  - pip
  - pip:
      # direct dependencies of reacher_ppo_nocritic.py / watch_reacher.py
      - matplotlib
      - numpy<2
      - torch
      # indirect: runtime dependencies of the vendored unityagents package
      - grpcio
      - pillow
      - protobuf==3.20.3
